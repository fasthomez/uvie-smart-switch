name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build, lint and test uvie-win
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build (release)
        run: cargo build --release --workspace

      - name: Validate Chromium extension
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/popup.js

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements --silent

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/uvie-win/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\iscc.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\iscc.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc "/DAppVersion=$ver" installer/uvie-win.iss

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: uvie-win-x86_64
          path: |
            target/release/uvie-win.exe
            target/release/uvie-native-host.exe
            browser-extension/**
            scripts/install-native-host.ps1
            dist/uvie-win-*-x64-setup.exe