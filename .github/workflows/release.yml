name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release UVie for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test

      - name: Cargo build (release)
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements --silent

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/uvie-win/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\iscc.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\iscc.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc "/DAppVersion=$ver" installer/uvie-win.iss

      - name: Package uvie-win.exe
        shell: pwsh
        run: |
          $stage = "dist/uvie-win"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/uvie-win.exe $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/uvie-for-windows-x86_64.zip" -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: UVie for Windows ${{ github.ref_name }}
          files: |
            dist/uvie-for-windows-x86_64.zip
            dist/uvie-win-*-x64-setup.exe
          generate_release_notes: true
