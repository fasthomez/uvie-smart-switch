[workspace]
resolver = "2"
members = [
    "crates/uvie-core",
    "crates/uvie-slintui",
    "crates/uvie-win",
]
default-members = [
    "crates/uvie-core",
    "crates/uvie-slintui",
    "crates/uvie-win",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uvie-project/uvie-win"

[workspace.dependencies]
uvie = { git = "https://github.com/uvie-project/uvie-rs", tag = "uvie-host-v0.2.1" }
uvie-host = { git = "https://github.com/uvie-project/uvie-rs", tag = "uvie-host-v0.2.1" }
uvie-core = { path = "crates/uvie-core" }
uvie-slintui = { path = "crates/uvie-slintui" }
slint = { version = "1.13", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
] }
slint-build = "1.13"
windows = "0.62"
windows-core = "0.62"
windows-link = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
